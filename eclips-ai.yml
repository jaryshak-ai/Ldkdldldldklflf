      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Кэш ускоряет все сборки, кроме первой
      - name: Кэш npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Генерация Android-проекта
        run: npx expo prebuild --platform android --no-install --clean

      - name: Сборка Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> gradle.properties
          ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: Eclips-AI-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
